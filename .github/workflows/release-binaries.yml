name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: pixelsup-linux-x64
            bin_name: pixelsup
          - os: macos-latest
            asset_name: pixelsup-macos-x64
            bin_name: pixelsup
          - os: windows-latest
            asset_name: pixelsup-windows-x64.exe
            bin_name: pixelsup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Create entrypoint
        run: |
          cat > entrypoint.py <<'PY'
          from pixelsup.cli import main

          if __name__ == "__main__":
              main()
          PY

      - name: Build binary
        run: uv run --with pyinstaller pyinstaller --onefile --name pixelsup entrypoint.py

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp "dist/${{ matrix.bin_name }}" "release/${{ matrix.asset_name }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.asset_name }}
