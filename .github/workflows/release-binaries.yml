name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: pixelsup-linux-x64
            bin_name: pixelsup
          - os: macos-latest
            asset_name: pixelsup-macos-x64
            bin_name: pixelsup
          - os: windows-latest
            asset_name: pixelsup-windows-x64.exe
            bin_name: pixelsup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Create entrypoint
        run: |
          python -c "from pathlib import Path; Path('entrypoint.py').write_text('from pixelsup.cli import main\nif __name__ == \"__main__\":\n    main()\n', encoding='utf-8')"

      - name: Build binary
        run: pyinstaller --onefile --name pixelsup entrypoint.py

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release
          cp "dist/${{ matrix.bin_name }}" "release/${{ matrix.asset_name }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.asset_name }}
