[project]
name = "pixelsup"
version = "0.1.0"
description = "Convert Blu-ray SUP subtitles into vertical sprite sheets with timeline mapping."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=11.0.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
pixelsup = "pixelsup.cli:main"
