[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pixelsup"
version = "0.1.0"
description = "Convert Blu-ray SUP subtitles into vertical sprite sheets with timeline mapping."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "pillow>=11.0.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
pixelsup = "pixelsup.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyrefly>=0.53.0",
    "ruff>=0.15.2",
]
